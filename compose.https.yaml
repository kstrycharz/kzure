services:
  api:
    environment:
      KZURE_ORIGIN: http://localhost:${KZURE_PORT:-8088},https://localhost:8443
  tls-gateway:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    group_add: ['0']
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./images/tls-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/tls:/etc/kzure/tls:ro
    networks: [management, ingress]
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      api: {condition: service_healthy}
      portal: {condition: service_started}
