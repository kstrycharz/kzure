server {
  listen 8443 ssl;
  server_tokens off;
  ssl_certificate /etc/kzure/tls/server.crt;
  ssl_certificate_key /etc/kzure/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 2m;
  location ~ ^/api/(terminal-sessions|desktop-sessions)/[a-f0-9]+/stream$ {
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3h;
    proxy_send_timeout 3h;
  }
  location /api/ {
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / { proxy_pass http://portal:8080; proxy_set_header Host $http_host; }
}
