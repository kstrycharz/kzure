server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  client_max_body_size 2m;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /api/images { proxy_pass http://api:8090; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 10m; }
  location ~ ^/api/(terminal-sessions|desktop-sessions)/[a-f0-9]+/stream$ {
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 3h;
    proxy_send_timeout 3h;
  }
  location /api/ { proxy_pass http://api:8090; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 40s; }
  location / { try_files $uri $uri/ /index.html; }
}
